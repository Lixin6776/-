[project]
name = "qianchuan-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "playwright>=1.50,<2",
  "httpx>=0.28,<1",
  "sse-starlette>=2.2,<3",
  "structlog>=24.4,<26"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "httpx2>=2,<3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["cdp: requires a locally running Chrome/Edge with CDP"]

[tool.ruff]
line-length = 100
target-version = "py311"